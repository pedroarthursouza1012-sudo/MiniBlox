<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestiário</title>
    <link rel="stylesheet" href="css/vestiario.css">
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body >
    <header>
        <h1>VESTIÁRIO 🎩</h1>
        <div class="links">
            <a href="index.html">MiniBlox 🎮</a>
            <a href="loja.html">Loja 🛒</a>
            <a href="conta.html">Conta 👤</a>
            <a href="ranking.html">🏆 Ranking</a>
        </div>
    </header>

<section class="painel">
    <div class="personel">
    <div class="persoBox">
        
        <div class="personagem">
           
            <div class="cabeca">
                <div class="cabelo"></div>
                
                <div class="cabelo-feminino">
                    <div class="mecha-esquerda"></div>
                    <div class="mecha-direita"></div>
                </div>
                
                <div class="olho-esquerdo"></div>
                <div class="olho-direito"></div>
            </div>
            
            <div class="corpo">
                
                <div class="braco-esquerdo"></div>
                <div class="braco-direito"></div>
            </div>
            

            <div class="pernas">
                <div class="perna-esquerda"></div>
                <div class="perna-direita"></div>
            </div>
        </div>

    </div>

    <div class="selectors">

        <p>Cabelo</p>
        <select name="cabelo" id="cabeloSelect">
            <option value="cabeloM">Masculino</option>
            <option value="cabeloF">Feminino</option>
        </select>

        <p>Cor de Cabelo</p>
        <select name="cabeloCor" id="corCabeloSelect">
            <option value="cabelo1">1</option>
            <option value="cabelo2">2</option>
            <option value="cabelo3">3</option>
            <option value="cabelo4">4</option>
            <option value="cabelo5">5</option>
        </select>

        <p>Pele</p>
        <select name="pele" id="peleSelect">
            <option value="pele1">1</option>
            <option value="pele2">2</option>
            <option value="pele3">3</option>
            <option value="pele4">4</option>
            <option value="pele5">5</option>
        </select>

        <p>Camisa</p>
        <select name="camisa" id="camisaSelect">
            <option value="corInicial">Preta</option>
            <option value="branca">Branca</option>
            <option value="vermelha">Vermelha</option>
            <option value="azul">Azul</option>
            <option value="roxa">Roxa</option>
            <option value="rosa">Rosa</option>
            <option value="verde">Verde</option>
            <option value="Amarela">Amarela</option>
            <option value="palmeiras">Palmeiras</option>
            <option value="flamengo">Flamengo</option>
            <option value="sao-paulo">São Paulo</option>
            <option value="fluminense">Fluminense</option>
            <option value="bahia">Bahia</option>
            <option value="botafogo">Botafogo</option>
            <option value="gremio">Grêmio</option>
            <option value="vasco">Vasco</option>
            <option value="internacional">Internacional</option>
            <option value="santos">Santos</option>
            <option value="corinthians">Corinthians</option>
            <option value="mirassol">Mirassol</option>
        </select>

        <p>Calça</p>
        <select name="calca" id="calcaSelect">
            <option value="azul">Azul</option>
            <option value="bege">Bege</option>
            <option value="preta">Preta</option>
        </select>
    </div>
    </div>
    <button id="salvarPersonagem">Salvar ✅</button>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/vestiario.js"></script>
</body>
</html>
