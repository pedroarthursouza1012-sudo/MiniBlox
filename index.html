<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBlox</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

</head>
<body>
    

<div class="cadastro">
    <form id="formAuth">

        <h2 id="tituloAuth">Cadastrar-se 📄</h2>

        <div id="campoNome">
            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                minlength="3"
                maxlength="25"
            >
        </div>

        <label for="password">Senha:</label>
        <input
            type="password"
            id="password"
            placeholder="Digite sua senha"
            required
            minlength="6"
            maxlength="25"
            class="password"
        >

        <div id="campoConfirmar">
            <label for="passwordConfirm">Confirme a senha:</label>
            <input
                class="password"
                type="password"
                id="passwordConfirm"
                placeholder="Confirme sua senha"
                minlength="6"
                maxlength="25"
                
            >
        </div>

        <button class="submit" id="submitBtn" type="submit">
            Cadastrar
        </button>

        <p id="alternarAuth">
            Já tem uma conta?
            <a href="#" id="alternarBtn">Entrar</a>
        </p>

    </form>
</div>

<div class="screen">
    
    <header>
        <h1>MINIBLOX 🎮</h1>
        <div class="links">
            <a href="vestiario.html">Vestiário 🎩</a>
            <a href="loja.html">Loja 🛒</a>
            <a href="conta.html">Conta 👤</a>
        </div>
    </header>



    <main>
        
        <section class="painel">

            <div class="games">

                <div class="game-wrapper">

                    <div class="game">
                        <img src="assets/MiniBloxRun.jpg" alt="miniblox" class="gameImg">    
                        <a href="MiniBloxRun/index.html">JOGAR</a>
                    </div>

                </div>
                
                <div class="game-wrapper">

                    <div class="game">
                        <img src="assets/AntiGravity.jpg" alt="antigravity" class="gameImg">    
                        <a href="AntiGravity/index.html">JOGAR</a>
                    </div>

                </div>

                <div class="game-wrapper">

                    <div class="game">
                        <img src="assets/8ball.jpg" alt="8ball" class="gameImg">
                        <a href="SinucaBlox/index.html">JOGAR</a>
                    </div>

                </div>

                <div class="game-wrapper">

                    <div class="game">
                        <img src="assets/KnifeHit.jpg" alt="knifeHit" class="gameImg">
                        <a href="KnifeHit/index.html">JOGAR</a>
                    </div>

                </div>

                <div class="game-wrapper">
                    <div class="game">
                        <img src="assets/ZombieRush.jpg" alt="ZombieRush" class="gameImg">

                </div>

                <div class="game-wrapper">
                    <div class="game">

                </div>

                <div class="game-wrapper">
                    <div class="game">

                </div>

                <div class="game-wrapper">

                    <div class="game">
                        <img src="assets/PunchBlox.jpg" alt="PunchBlox" class="gameImg">

                    </div>
                    
                </div>

                </div>
            
        </section>


    </main>
    </div>

</body>
</html>
