<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBlox</title>
    <link rel="stylesheet" href="css/style.css">

        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

<body>
    
    <div class="cadastro">
    <form>

        <h2>Cadastrar-se 📄</h2>
        <label for="text">Nome:</label>
        <input type="text" placeholder="Digite seu nome" required maxlength="25" id="nome">
        

        <p>Escolha seu gênero:</p>

        <div class="gen-opt">
            <input type="radio" id="man" name="genero" value="man" required>
            <label for="man">Homem</label>
        </div>

        <div class="gen-opt">
            <input type="radio" id="woman" name="genero" value="woman">
            <label for="woman">Mulher</label>
        </div>

        <div class="gen-opt">
            <input type="radio" id="noBin" name="genero" value="noBin">
            <label for="noBin">Prefiro não me identificar</label>
        </div>


        <button class="submit" id="submitBtn" >Enviar</button>
    </form>
    </div>
<div class="screen">
    
    <header>
        <h1>MINIBLOX 🎮</h1>

                <div class="game-wrapper">

                    <div class="game">
                        <img src="assets/KnifeHit.jpg" alt="knifeHit" class="gameImg">
